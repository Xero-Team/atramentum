name: Android APK

# 出 APK 比网页部署重得多（首次要下 Gradle 与 Android 依赖），所以：
# - push main 自动出一版，方便随时取最新包
# - 打 tag（v*）也出一版，便于对应版本
# - 也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # AGP 8.13 要求 JDK 17 起，用 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 必须显式给 packages：这 action 的默认值是 'tools platform-tools'，
      # 而 tools 在现代 SDK 仓库里已经不存在了（被 cmdline-tools 取代），
      # 默认值会让它直接报 "Failed to find package 'tools'" 并以退出码 1 结束
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 许可必须先接受，否则 Gradle 拉不到缺的 SDK 组件
      - name: 准备 Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platform-tools"
          # build-tools 的默认版本跟着 AGP 走，名字写错也不该让这一步挂掉——
          # 许可已接受，Gradle 自己会补拉缺的组件
          sdkmanager "build-tools;36.0.0" || echo "build-tools;36.0.0 未装，交给 Gradle 处理"
          echo "--- 已装组件 ---"
          sdkmanager --list_installed | sed -n '1,25p'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - run: npm run build

      # android/ 不入库（见 .gitignore），每次现生成，保证原生工程与 package.json
      # 里的 Capacitor 版本一致
      - name: 生成原生工程并同步 Web 资源
        run: |
          npx cap add android
          npx cap sync android
          echo "--- 已发现的插件 ---"
          npx cap ls android || true

      - name: 构建 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集产物信息
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moxue-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
