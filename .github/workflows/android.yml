name: Android APK

# Pushing to main produces a build and publishes it to a Release (a fixed
# download URL beats digging through Actions artefacts); it can also be run by
# hand from the Actions page.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Publishing a release needs write access
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # AGP 8.13 needs JDK 17 or newer; 21 it is
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # packages must be given explicitly: this action defaults to
      # 'tools platform-tools', and 'tools' no longer exists in the modern SDK
      # repository (cmdline-tools replaced it). The default makes it fail with
      # "Failed to find package 'tools'" and exit 1.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Licences have to be accepted first, or Gradle cannot fetch missing SDK components
      - name: Prepare the Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platform-tools"
          # The default build-tools version follows AGP, and a wrong name should
          # not fail this step — the licences are accepted, so Gradle will fetch
          # anything missing itself
          sdkmanager "build-tools;36.0.0" || echo "build-tools;36.0.0 not installed; leaving it to Gradle"
          echo "--- installed packages ---"
          sdkmanager --list_installed | sed -n '1,25p'

      # Caching the signing key matters: AGP generates a fresh debug.keystore when
      # one is missing, and GitHub runners start clean every time. Without the
      # cache every build is signed differently, and the user cannot install over
      # the previous one (Android refuses an update whose signature differs, so
      # they must uninstall first — losing all local data).
      #
      # The path is where AGP 8 actually writes it (measured, not copied from the
      # ~/.android/ you find online): Android's user directory follows the XDG
      # convention, i.e. ~/.config/.android/.
      # If that changes again, the "check signature and artefacts" step prints
      # apksigner's certificate fingerprint — if it differs between two builds,
      # this has broken again.
      - name: Cache the debug keystore (so every build signs identically)
        uses: actions/cache@v6
        with:
          path: ~/.config/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - run: npm run build

      # android/ is not committed (see .gitignore) and is generated every time, so
      # the native project always matches the Capacitor version in package.json
      - name: Generate the native project and sync the web assets
        run: |
          npx cap add android
          npx cap sync android
          echo "--- plugins found ---"
          npx cap ls android || true

      # The icons and splash screens were rasterised locally and committed under
      # resources/android/res: the build machine has no Chrome, so they cannot be
      # generated here. See scripts/make-icons.mjs
      - name: Swap in Atramentum's icons and splash screens
        run: |
          RES=android/app/src/main/res
          # The template's splash background is a Capacitor logo PNG with the same
          # name as our splash.xml, and leaving it in place reports a duplicate resource
          rm -f $RES/drawable*/splash.png
          cp -r resources/android/res/. $RES/

          # Android 12+ draws the splash through the system SplashScreen API, so the
          # background colour has to come from the theme. The template's styles.xml is
          # generated, so it can only be patched; a missing anchor fails the build
          # rather than letting this go quietly stale when Capacitor changes template
          STYLES=$RES/values/styles.xml
          grep -q 'AppTheme.NoActionBarLaunch' "$STYLES" || { echo "::error::the template styles.xml has changed shape; the splash patch needs updating"; exit 1; }
          sed -i 's#<item name="android:background">@drawable/splash</item>#&\n        <item name="windowSplashScreenBackground">@color/moxue_splash_background</item>#' "$STYLES"
          grep -q 'windowSplashScreenBackground' "$STYLES" || { echo "::error::the splash patch did not apply"; exit 1; }

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Print the signing certificate fingerprint: it changes if the key does, and a
      # changed key means the user cannot install over the previous build. When an
      # install fails, look here first.
      - name: Check the signature and the artefacts
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)
          "${BT}apksigner" verify --print-certs "$APK"
          "${BT}aapt2" dump badging "$APK" | grep -E "^package|^application-label:|^sdkVersion|^native-code" || true

          # The fingerprint is the only proof the signing is consistent: if two builds
          # in a row disagree, the keystore cache above has broken again (which is what
          # happens when AGP moves where it writes the file). Print the real path too.
          echo "--- where the debug keystore actually landed ---"
          find "$HOME" -maxdepth 5 -name '*.keystore' 2>/dev/null | head -5

      # A stable file name, so the Release download URL never changes
      - name: Prepare the release artefact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk moxue-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: moxue-debug-apk
          path: moxue-android.apk
          if-no-files-found: error
          retention-days: 30

      # Every build updates the same Release (tag fixed at android-latest), so the
      # download URL is constant:
      # https://github.com/Xero-Team/atramentum/releases/latest/download/moxue-android.apk
      # An attachment of the same name is replaced rather than piling up.
      - name: Publish to the Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: Atramentum Android · rolling build
          body: |
            Updated automatically on every `main` build — download and install.

            This APK is signed with a **debug key**. Installing it yourself or
            passing it to a friend is fine; publishing to Google Play needs a
            release keystore of your own (put it in the repository secrets).

            If installing over an existing copy fails ("App not installed"), the
            signing key has usually changed. Uninstall the old one first — that
            clears local data, so export anything important as a zip from inside
            the app beforehand.

            - Commit: `${{ github.sha }}`
            - Build: `${{ github.run_number }}`
          files: moxue-android.apk
          fail_on_unmatched_files: true
