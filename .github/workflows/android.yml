name: Android APK

# push main 自动出一版并发到 Release（下载地址固定，比翻 Actions 产物顺手）；
# 也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 发 Release 需要写权限
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # AGP 8.13 要求 JDK 17 起，用 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 必须显式给 packages：这 action 的默认值是 'tools platform-tools'，
      # 而 tools 在现代 SDK 仓库里已经不存在了（被 cmdline-tools 取代），
      # 默认值会让它直接报 "Failed to find package 'tools'" 并以退出码 1 结束
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 许可必须先接受，否则 Gradle 拉不到缺的 SDK 组件
      - name: 准备 Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platform-tools"
          # build-tools 的默认版本跟着 AGP 走，名字写错也不该让这一步挂掉——
          # 许可已接受，Gradle 自己会补拉缺的组件
          sdkmanager "build-tools;36.0.0" || echo "build-tools;36.0.0 未装，交给 Gradle 处理"
          echo "--- 已装组件 ---"
          sdkmanager --list_installed | sed -n '1,25p'

      # 签名密钥的缓存很关键：AGP 在缺少 ~/.android/debug.keystore 时会现生成一把，
      # 而 GitHub 的 runner 每次都是干净的——不缓存的话每次构建签名都不一样，
      # 用户就没法覆盖安装（Android 拒绝签名不一致的更新，只能先卸载、数据一起没）。
      - name: 缓存 debug keystore（保证各次构建签名一致）
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - run: npm run build

      # android/ 不入库（见 .gitignore），每次现生成，保证原生工程与 package.json
      # 里的 Capacitor 版本一致
      - name: 生成原生工程并同步 Web 资源
        run: |
          npx cap add android
          npx cap sync android
          echo "--- 已发现的插件 ---"
          npx cap ls android || true

      # 图标与启动画面是本地光栅化好提交在 resources/android/res 下的：
      # 构建机上没有 Chrome，不能现生成。见 scripts/make-icons.mjs
      - name: 换上墨痕的图标与启动画面
        run: |
          RES=android/app/src/main/res
          # 模板自带的启动底是 Capacitor logo 的 PNG，与我们的 splash.xml 同名，
          # 留着会报资源重复
          rm -f $RES/drawable*/splash.png
          cp -r resources/android/res/. $RES/

          # Android 12+ 的启动画面走系统 SplashScreen API，背景色得从主题里给。
          # 模板的 styles.xml 是生成物，只能打补丁；锚点找不到就报错退出，
          # 免得 Capacitor 换模板之后这里静默失效
          STYLES=$RES/values/styles.xml
          grep -q 'AppTheme.NoActionBarLaunch' "$STYLES" || { echo "::error::模板 styles.xml 结构变了，启动画面补丁需要更新"; exit 1; }
          sed -i 's#<item name="android:background">@drawable/splash</item>#&\n        <item name="windowSplashScreenBackground">@color/moxue_splash_background</item>#' "$STYLES"
          grep -q 'windowSplashScreenBackground' "$STYLES" || { echo "::error::启动画面补丁没打上"; exit 1; }

      - name: 构建 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 打印签名证书指纹：换过密钥这里会变，而密钥一变用户就没法覆盖安装。
      # 出安装问题时第一眼看这里。
      - name: 检查签名与产物
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)
          "${BT}apksigner" verify --print-certs "$APK"
          "${BT}aapt2" dump badging "$APK" | grep -E "^package|^application-label|^sdkVersion|^native-code" || true

      # 稳定的文件名，Release 的下载地址才不会每次都变
      - name: 准备发布产物
        run: cp android/app/build/outputs/apk/debug/app-debug.apk moxue-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moxue-debug-apk
          path: moxue-android.apk
          if-no-files-found: error
          retention-days: 30

      # 每次构建更新同一个 Release（tag 固定为 android-latest），下载地址恒定：
      # https://github.com/Xero-Team/atramentum/releases/latest/download/moxue-android.apk
      # 同名附件会被替换，不会越堆越多。
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 墨痕 Android · 滚动构建
          body: |
            每次 `main` 构建自动更新到这里，直接下载安装即可。

            这是 **debug 签名**的包——自己装、发给朋友都没问题；上架 Google Play
            需要自备 release keystore（放仓库 secrets）。

            覆盖安装失败（提示「应用未安装」）通常意味着签名变了，先卸载旧的再装
            （会清掉本地数据，重要内容记得先在应用内「导出 zip」）。

            - 提交：`${{ github.sha }}`
            - 构建序号：`${{ github.run_number }}`
          files: moxue-android.apk
          fail_on_unmatched_files: true
