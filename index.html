<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS 不认 manifest 里的图标，主屏图标走 apple-touch-icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 装到主屏后以独立窗口打开，不再有浏览器地址栏。
         iOS 认 apple-mobile-web-app-capable，Android / 桌面认 manifest 的 display -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default：状态栏不透明、应用内容从状态栏下方开始。若改 black-translucent，
         页面会穿到状态栏底下，必须给所有根节点补 env(safe-area-inset-top)，目前没做 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="墨痕" />
    <!-- viewport-fit=cover：让 env(safe-area-inset-*) 可用（刘海 / 底部指示条避让）；
         interactive-widget=resizes-content：软键盘弹出时压缩布局视口，
         否则 h-dvh 的盒子底部会被键盘盖住 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="墨痕 · AI 陪学——课件阅读与生成" />
    <title>墨痕 · AI 陪学</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
